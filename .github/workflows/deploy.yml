name: deployment
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 刻意鎖版本；升級前先確認全書範例都通過。
  GO_VERSION: "1.27.1"
  MDBOOK_VERSION: "0.5.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install mdBook
        run: |
          curl -sSL --fail "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Check Go examples
        run: go run ./tools/checkcode zh-TW/src

      - name: Vet and test
        run: go vet ./... && go test -race ./...

      - name: Check no ANCHOR in go doc
        run: |
          if go list ./examples/... | xargs -n1 go doc -all | grep -n ANCHOR; then
            echo "ANCHOR leaked into a doc comment; see docs/style-guide.md" >&2
            exit 1
          fi

      - name: Build book
        working-directory: zh-TW
        run: mdbook build

      # 給 AI 助教用的原始檔：保留 repo 結構，include 的相對路徑才對得上 examples/
      - name: Package sources for AI
        run: zip -r -q zh-TW/book/go-senior-src.zip zh-TW/src examples go.mod -x '*.DS_Store'

      - name: Assemble site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -r zh-TW/book public/zh-TW

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v5
