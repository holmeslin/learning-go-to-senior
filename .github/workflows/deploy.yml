name: deployment
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 刻意鎖版本；升級前先確認全書範例都通過。
  GO_VERSION: "1.27.1"
  MDBOOK_VERSION: "0.5.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install mdBook
        run: |
          curl -sSL --fail "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Check Go examples
        run: go run ./tools/checkcode zh-TW/src

      - name: Vet and test
        run: go vet ./... && go test -race ./...

      - name: Build book
        working-directory: zh-TW
        run: mdbook build

      - name: Assemble site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -r zh-TW/book public/zh-TW

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v5
